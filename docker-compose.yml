services:
  mariadb:
    image: mariadb:11.4
    container_name: politicalpaths-mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - politicalpaths_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2-alpine
    container_name: politicalpaths-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - politicalpaths_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  import-job:
    build:
      context: .
      dockerfile: src/PoliticalPaths.ImportWorker/Dockerfile
    container_name: politicalpaths-import
    command: ["full-sync"]
    restart: "no"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__MariaDb: "Server=mariadb;Port=3306;Database=${MARIADB_DATABASE};Uid=${MARIADB_USER};Pwd=${MARIADB_PASSWORD};"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD},abortConnect=false"
      Import__InboxPath: "source-data/inbox"
      Import__LogsPath: "logs/imports/app-.log"
      Import__ReportsPath: "/app/reports"
    volumes:
      - ./source-data:/app/source-data:ro
      - ./logs/imports:/app/logs/imports
      - ./reports:/app/reports

  dashboard:
    build:
      context: .
      dockerfile: src/PoliticalPaths.Dashboard/Dockerfile
    container_name: politicalpaths-dashboard
    restart: unless-stopped
    depends_on:
      import-job:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MariaDb: "Server=mariadb;Port=3306;Database=${MARIADB_DATABASE};Uid=${MARIADB_USER};Pwd=${MARIADB_PASSWORD};"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD},abortConnect=false"
    ports:
      - "8080:8080"

volumes:
  politicalpaths_mariadb_data:
  politicalpaths_redis_data:
