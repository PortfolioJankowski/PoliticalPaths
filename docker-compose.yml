services:
  mariadb:
    image: mariadb:11.4
    container_name: politicalpaths-mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - politicalpaths_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2-alpine
    container_name: politicalpaths-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - politicalpaths_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management
    container_name: politicalpaths-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - politicalpaths_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  import-job:
    build:
      context: .
      dockerfile: src/PoliticalPaths.ImportWorker/Dockerfile
    container_name: politicalpaths-import
    command: ["full-sync"]
    restart: "no"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__MariaDb: "Server=mariadb;Port=3306;Database=${MARIADB_DATABASE};Uid=${MARIADB_USER};Pwd=${MARIADB_PASSWORD};"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD},abortConnect=false"
      Import__InboxPath: "source-data/inbox"
      Import__LogsPath: "logs/imports/app-.log"
      Import__ReportsPath: "/app/reports"
      Identity__SeedAdmin__Enabled: "true"
      Identity__SeedAdmin__Email: "${SEED_ADMIN_EMAIL}"
      Identity__SeedAdmin__Password: "${SEED_ADMIN_PASSWORD}"
    volumes:
      - ./source-data:/app/source-data:ro
      - ./logs/imports:/app/logs/imports
      - ./reports:/app/reports

  dashboard:
    build:
      context: .
      dockerfile: src/PoliticalPaths.Dashboard/Dockerfile
    container_name: politicalpaths-dashboard
    restart: unless-stopped
    depends_on:
      import-job:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MariaDb: "Server=mariadb;Port=3306;Database=${MARIADB_DATABASE};Uid=${MARIADB_USER};Pwd=${MARIADB_PASSWORD};"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD},abortConnect=false"
      DataProtection__KeysPath: "/app/data-protection-keys"
      RabbitMq__Enabled: "true"
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: ${RABBITMQ_PORT:-5672}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-/}
      RabbitMq__Username: ${RABBITMQ_USERNAME}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__UseTls: ${RABBITMQ_USE_TLS:-false}
      RabbitMq__ConnectionName: politicalpaths-dashboard-outbox
    volumes:
      - politicalpaths_dataprotection_keys:/app/data-protection-keys
    ports:
      - "8080:8080"

  notification-worker:
    build:
      context: .
      dockerfile: src/PoliticalPaths.NotificationWorker/Dockerfile
    container_name: politicalpaths-notifications
    restart: unless-stopped
    depends_on:
      import-job:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__MariaDb: "Server=mariadb;Port=3306;Database=${MARIADB_DATABASE};Uid=${MARIADB_USER};Pwd=${MARIADB_PASSWORD};"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD},abortConnect=false"
      RabbitMq__Enabled: "true"
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: ${RABBITMQ_PORT:-5672}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-/}
      RabbitMq__Username: ${RABBITMQ_USERNAME}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__UseTls: ${RABBITMQ_USE_TLS:-false}
      RabbitMq__ConnectionName: politicalpaths-notification-worker
      Discord__WebhookUrl: ${DISCORD_WEBHOOK_URL}
      Discord__Username: "${DISCORD_USERNAME:-Political Paths}"
      SendGrid__Enabled: ${SENDGRID_ENABLED:-false}
      SendGrid__ApiKey: ${SENDGRID_API_KEY}
      SendGrid__FromEmail: ${SENDGRID_FROM_EMAIL}
      SendGrid__FromName: "${SENDGRID_FROM_NAME:-Political Paths}"

volumes:
  politicalpaths_mariadb_data:
  politicalpaths_redis_data:
  politicalpaths_rabbitmq_data:
  politicalpaths_dataprotection_keys:
